[project]
name = "claude-office-codex-adapter"
version = "0.1.0"
description = "Fail-open Codex lifecycle hook adapter for Claude Office"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
claude-office-codex-adapter = "claude_office_codex_adapter.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]
